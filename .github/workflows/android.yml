name: Android app and JNI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "ndk;28.2.13676358" "cmake;3.22.1" "system-images;android-35;google_apis;x86_64"
      - name: Build APK and run lint before emulator startup
        run: |
          mkdir -p app/build/diagnostics
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:compileDebugAndroidTestKotlin 2>&1 | tee app/build/diagnostics/gradle-build.log
      - name: Surface Gradle failure details in check annotations
        if: failure()
        run: |
          if [ -f app/build/diagnostics/gradle-build.log ]; then
            grep -E '^(FAILURE:|\* What went wrong:|Execution failed for task|e: |Could not resolve|Could not find|> Task .* FAILED|Caused by:)' app/build/diagnostics/gradle-build.log | tail -n 30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Verify APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
      - name: Check KVM availability for the emulator
        id: kvm
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod a+rw /dev/kvm
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'KVM is available; emulator instrumentation will run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::error::KVM unavailable: codec instrumentation and APK publication cannot proceed.'
            echo 'KVM unavailable; instrumentation and APK publication blocked.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Boot emulator with captured diagnostics and run render/JNI tests
        if: steps.kvm.outputs.available == 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Pinned stable SDK emulator; the rolling 37.2.12 process exited before guest boot.
          curl -fL --retry 3 https://dl.google.com/android/repository/emulator-linux_x64-14788078.zip -o "$RUNNER_TEMP/emulator.zip"
          echo "85eab2a52517e8cac33dcd7fe3bed43a19472c9c2f17badf1f2616327d71488f  $RUNNER_TEMP/emulator.zip" | sha256sum -c -
          if [[ -d "$ANDROID_HOME/emulator" ]]; then mv "$ANDROID_HOME/emulator" "$ANDROID_HOME/emulator-original"; fi
          unzip -q "$RUNNER_TEMP/emulator.zip" -d "$ANDROID_HOME"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libnss3 libgbm1 libxkbcommon0 libasound2t64
          export QT_QPA_PLATFORM=offscreen
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name owncut --path "$ANDROID_AVD_HOME/owncut.avd" --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/owncut.avd" > "$ANDROID_AVD_HOME/owncut.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" | tee app/build/diagnostics/emulator-libraries.log
          mkdir -p app/build/diagnostics
          "$ANDROID_HOME/emulator/emulator" -avd owncut -verbose -show-kernel -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -memory 2048 -cores 2 -accel on > app/build/diagnostics/emulator.log 2>&1 &
          emulator_pid=$!
          booted=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then wait "$emulator_pid" || echo "::warning::Emulator process exit code $?"; break; fi
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == "1" ]]; then booted=true; break; fi
            sleep 3
          done
          if [[ "$booted" != true ]]; then
            tail -n 150 app/build/diagnostics/emulator.log | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done
            echo '::error::Emulator did not boot; real codec tests were not executed.'
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Surface instrumentation failures in annotations
        if: failure()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      text = (case.get('name', '') + ': ' + (failure.text or failure.get('message', '')))[:6000]
                      print('::error::' + text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          PYTEST
      - name: Publish private phone-test APK release
        if: success() && steps.kvm.outputs.available == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/arena/6e511b63-new-cc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$apk" > "$apk.sha256"
          tag="phone-test-${GITHUB_RUN_ID}"
          gh release create "$tag" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Owncut phone-test build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK for manual phone testing. Not a production release. Includes arm64-v8a and x86_64. Built from ${GITHUB_SHA}."
          echo "APK release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK and Android reports for device testing
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: owncut-debug-android-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/outputs/androidTest-results/connected/**
            app/build/diagnostics/gradle-build.log
            app/build/diagnostics/emulator.log
          if-no-files-found: warn
          retention-days: 14
