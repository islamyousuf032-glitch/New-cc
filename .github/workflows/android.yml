name: Android app and JNI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "ndk;28.2.13676358" "cmake;3.22.1" "system-images;android-35;google_apis;x86_64"
      - name: Build APK and run lint before emulator startup
        run: |
          mkdir -p app/build/diagnostics
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee app/build/diagnostics/gradle-build.log
      - name: Surface Gradle failure details in check annotations
        if: failure()
        run: |
          if [ -f app/build/diagnostics/gradle-build.log ]; then
            grep -E '^(FAILURE:|\* What went wrong:|Execution failed for task|e: |Could not resolve|Could not find|> Task .* FAILED|Caused by:)' app/build/diagnostics/gradle-build.log | tail -n 30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Verify APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
      - name: Publish private phone-test APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/6e511b63-new-cc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$apk" > "$apk.sha256"
          tag="phone-test-${GITHUB_RUN_ID}"
          gh release create "$tag" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Owncut phone-test build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK for manual phone testing. Not a production release. Includes arm64-v8a and x86_64. Built from ${GITHUB_SHA}."
          echo "APK release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Check KVM availability for the emulator
        id: kvm
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'KVM is available; emulator instrumentation will run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::KVM is unavailable on this runner; skipping emulator instrumentation. APK build, lint, alignment, and release checks still ran.'
            echo 'KVM unavailable; emulator instrumentation skipped. APK build, lint, alignment, and release checks still ran.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run native JNI instrumentation smoke test
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          ram-size: 2048M
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload debug APK and Android reports for device testing
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: owncut-debug-android-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/outputs/androidTest-results/connected/**
            app/build/diagnostics/gradle-build.log
          if-no-files-found: warn
          retention-days: 14
